- id: ocs-inventory-ng
  name: OCS Inventory NG
  summary: IT inventory platform that collects hardware and software data from agents and network discovery.
  official_url: https://ocsinventory-ng.org/
  repository_url: https://github.com/OCSInventory-NG/OCSInventory-Server
  repository_archived: false
  documentation_url: https://wiki.ocsinventory-ng.org/
  categories:
  - policy-governance-compliance
  roles:
  - devsecops-engineer
  - cloud-security-engineer
  - platform-engineer
  lifecycle_stages:
  - secure
  - operate
  use_when:
  - You need automated endpoint and network asset inventory with self-hosted data control.
  avoid_when:
  - Avoid it when agentless cloud inventory or a full IT service-management workflow is the primary requirement.
  deployment_models:
  - self-hosted
  license_model: open-core
  license_spdx: GPL-2.0-only
  commercial_offering: true
  maturity: established
  status: active
  alternatives: []
  tags: []
  verified_on: '2026-08-21'
  sources:
  - https://ocsinventory-ng.org/
  - https://wiki.ocsinventory-ng.org/
  - https://github.com/OCSInventory-NG/OCSInventory-Server
  needs_review: false
- id: risk-analysis-editor
  name: Risk Analysis Editor
  summary: Offline browser-based editor for configurable risk registers, treatment plans, matrices, and reports.
  official_url: https://www.risk-analysis-editor.com/
  repository_url: https://github.com/StephaneV/Risk-Analysis-Editor
  categories:
  - policy-governance-compliance
  roles:
  - cloud-security-engineer
  - devsecops-engineer
  lifecycle_stages:
  - plan
  - secure
  use_when:
  - You need an offline, file-based risk-analysis workflow using EBIOS RM, GDPR DPIA, ISO 27005, or a custom scoring model.
  avoid_when:
  - You require collaborative workflow, centralized approvals, or integrations supplied by a governance platform.
  deployment_models:
  - local-web-application
  license_model: oss
  license_spdx: MIT
  status: active
  verified_on: '2026-08-12'
  sources:
  - https://www.risk-analysis-editor.com/
  - https://github.com/StephaneV/Risk-Analysis-Editor
  - https://github.com/StephaneV/Risk-Analysis-Editor/blob/main/LICENSE
  needs_review: false
- id: snipe-it
