- id: stress-ng
  name: stress-ng
  summary: GPL-2.0-or-later system stress generator exercising CPU, memory, filesystem, kernel and other
    resources on supported Unix-like platforms; throughput counters are not a precise benchmark suite.
  repository_url: https://github.com/ColinIanKing/stress-ng
  categories:
  - chaos-performance-engineering
  subcategories:
  - System Diagnostics & Stress Tools
  roles:
  - devops-engineer
  - site-reliability-engineer
  lifecycle_stages:
  - test
  - operate
  use_when:
  - You investigate kernel or hardware behavior under controlled resource pressure and select platform-supported
    stressors with bounded duration and monitoring.
  avoid_when:
  - You need precise benchmark accuracy or production-safe operation; stressors can cause thermal load,
    resource exhaustion and difficult-to-stop thrashing.
  - You cannot accept host impact or privilege-dependent behavior; root changes Linux OOM protection and
    enables additional operations, while available stressors depend on platform and build libraries.
  deployment_models:
  - cli
  - self-hosted
  license_model: oss
