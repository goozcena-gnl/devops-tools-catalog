[extend]
useDefault = true

[[allowlists]]
description = "Documented Git commit SHA misclassified as a Sourcegraph token"
regexTarget = "match"
regexes = [
  '''94165042278ade9470c023c76e8b768138fd1b99''',
]

[[allowlists]]
description = "Wave 27 yamllint GPL SPDX documentation false positive at pinned commit"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
commits = ["34dc4694dac88a9985040acedcaaaae7b4247729"]
