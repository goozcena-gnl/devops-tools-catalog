- id: k8up
  name: K8up
  summary: Kubernetes backup operator that schedules Restic-based PVC and application-aware backups and
    restores.
  official_url: https://k8up.io/
  repository_url: https://github.com/k8up-io/k8up
  documentation_url: https://docs.k8up.io/k8up/
