name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Git history with Gitleaks
        # v8.29.1 is pinned by immutable container digest. Dependabot does not
        # update container references, so review this pin during maintenance.
        run: >-
          docker run --rm
          --volume "$GITHUB_WORKSPACE:/repo"
          --workdir /repo
          ghcr.io/gitleaks/gitleaks:v8.29.1@sha256:aa036a2f4bdfe3cc3c55fa4326308efabb4a6be498c883c864fd1d0d5585438a
          git /repo
          --config /repo/.gitleaks.toml
          --redact
          --no-banner
