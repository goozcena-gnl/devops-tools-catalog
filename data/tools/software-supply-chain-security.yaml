- id: dependency-track
  name: Dependency-Track
  summary: OWASP component-analysis platform that continuously evaluates software bills of materials and supply-chain risk.
  official_url: https://dependencytrack.org
  repository_url: https://github.com/DependencyTrack/dependency-track
  repository_archived: false
  documentation_url: https://docs.dependencytrack.org/
  categories:
  - software-supply-chain-security
  - application-cloud-security
  roles:
  - devsecops-engineer
  - cloud-security-engineer
  - release-engineer
  lifecycle_stages:
  - secure
  - build
  - release
  use_when:
  - You need continuous SBOM ingestion, vulnerability intelligence, policy analysis, and portfolio-level component risk tracking.
  avoid_when:
  - A stateless scanner in a single pipeline is sufficient and you do not need a persistent component inventory.
  deployment_models:
  - self-hosted
  - container
  license_model: oss
  license_spdx: Apache-2.0
  maturity: established
  status: active
  alternatives:
  - osv-scanner
  - snyk
  tags:
  - sbom
  - software-composition-analysis
  - vulnerability-management
  verified_on: '2026-09-01'
  sources:
  - https://docs.dependencytrack.org/
  - https://github.com/DependencyTrack/dependency-track
  - https://github.com/DependencyTrack/dependency-track/blob/master/LICENSE
  needs_review: false
