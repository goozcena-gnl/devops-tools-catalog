name: Catalogue quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Check Python dependency drift
        run: python -m scripts.python_constraints --check

      - name: Install build backend
        run: python -m pip install --disable-pip-version-check --no-input -c config/python-constraints-3.12.txt hatchling editables

      - name: Install maintenance dependencies
        run: python -m pip install --disable-pip-version-check --no-input --no-build-isolation -c config/python-constraints-3.12.txt -e '.[dev]'

      - name: Lint maintenance code
        run: python -m ruff check scripts tests

      - name: Check maintenance code formatting
        run: python -m ruff format --check scripts tests

      - name: Run tests
        run: python -m pytest

      - name: Check generated documentation
        run: python -m scripts.generate_docs --check

      - name: Validate catalogue and repository hygiene
        run: python -m scripts.validate_catalog

      - name: Check whitespace errors
        run: git diff --check
