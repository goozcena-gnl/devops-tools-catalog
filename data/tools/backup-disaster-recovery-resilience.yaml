  roles:
  - kubernetes-engineer
  - site-reliability-engineer
  lifecycle_stages:
  - deploy
  - operate
  use_when:
  - You want Kubernetes custom resources to schedule PVC and application-aware backups to Restic-compatible
    storage.
  avoid_when:
  - You need cluster-resource backup beyond the documented data workflows or use storage-native snapshots
    as the recovery system of record.
